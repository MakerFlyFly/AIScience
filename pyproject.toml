[project]
name = "aiscience"
version = "0.1.0"
description = "Evidence-first, experiment-traceable Codex research operating system."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "filelock>=3.18,<4",
    "psutil>=7,<8",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
    "typer>=0.16,<1",
]

[project.scripts]
aiscience = "aiscience.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiscience"]

[dependency-groups]
demo = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "scipy>=1.13,<2",
]
dev = [
    "mypy>=1.17,<2",
    "pypdf>=5,<7",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aiscience"]
